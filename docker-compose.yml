name: defence-trainer

services:
  web:
    build:
      context: ./web
      target: ${BUILD_TARGET:-dev}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/defence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      STT_URL: http://stt:9001
      TTS_URL: http://tts:9002
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    build: ./api
    command: ["arq", "app.worker.main.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/defence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      STT_URL: http://stt:9001
      TTS_URL: http://tts:9002
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: defence
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d defence"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9090:9090"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  stt:
    build: ./stt
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-NbAiLab/nb-whisper-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
    volumes:
      - hfcache:/root/.cache/huggingface
    ports: ["9001:9001"]
    # Uncomment on an NVIDIA host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  tts:
    build: ./tts
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-nb_NO-talesyntese-medium}
    volumes:
      - piperdata:/voices
    ports: ["9002:9002"]

volumes:
  pgdata:
  miniodata:
  hfcache:
  piperdata:
