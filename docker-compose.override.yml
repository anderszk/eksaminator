# Dev overrides: bind mounts + hot reload. Applied automatically by docker compose.
services:
  api:
    volumes:
      - ./api:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    volumes:
      - ./api:/app

  web:
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
