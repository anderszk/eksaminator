[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eksaminator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "sqlalchemy[asyncio]==2.0.*",
    "psycopg[binary]==3.2.*",
    "alembic==1.14.*",
    "arq==0.26.*",
    "openai==1.*",
    "pymupdf==1.25.*",
    "sentence-transformers==3.*",
    "httpx==0.28.*",
    "boto3==1.35.*",
    "pydantic-settings==2.*",
    "pgvector==0.3.*",
    "redis[hiredis]==5.*",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["app*"]
